<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escada Conecta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; }
    header { background: #1976d2; color: white; padding: 20px; text-align: center; }
    header h1 { font-size: 1.8rem; }
    .search-box { padding: 15px; }
    #search { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .categorias { display: flex; gap: 10px; padding: 0 15px 15px; overflow-x: auto; }
    .cat-btn { padding: 8px 16px; border: none; background: #e0e0e0; border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .cat-btn.ativo { background: #1976d2; color: white; }
    .empresas { padding: 15px; display: grid; gap: 15px; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card h3 { margin-bottom: 4px; }
    .card .tipo { color: #666; font-size: 0.9rem; margin-bottom: 12px; }
    .card .avaliacao { color: #ff9800; margin-bottom: 12px; }
    .whatsapp { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .whatsapp:hover { background: #1da851; }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Escada Conecta</h1>
    <p>Encontre empresas em Escada-PE</p>
  </header>
  <div class="search-box">
    <input type="text" id="search" placeholder="Pesquisar empresa...">
  </div>
  <div class="categorias">
    <button class="cat-btn ativo" data-cat="todas">Todas</button>
    <button class="cat-btn" data-cat="restaurante">Restaurantes</button>
    <button class="cat-btn" data-cat="tecnologia">Tecnologia</button>
    <button class="cat-btn" data-cat="mercado">Mercados</button>
  </div>
  <div class="empresas" id="lista-empresas">
    <div class="card" data-categoria="restaurante" data-nome="pizzaria central">
      <h3>Pizzaria Central</h3>
      <p class="tipo">Restaurante</p>
      <p class="avaliacao">★★★★★ 5.0</p>
      <button class="whatsapp" data-numero="5581900000001">WhatsApp</button>
    </div>
    <div class="card" data-categoria="tecnologia" data-nome="tech escada">
      <h3>Tech Escada</h3>
      <p class="tipo">Loja de Tecnologia</p>
      <p class="avaliacao">★★★★☆ 4.8</p>
      <button class="whatsapp" data-numero="5581900000002">WhatsApp</button>
    </div>
    <div class="card" data-categoria="mercado" data-nome="açougue do neto">
      <h3>Açougue do Neto</h3>
      <p class="tipo">Açougue</p>
      <p class="avaliacao">★★★★☆ 4.5</p>
      <button class="whatsapp" data-numero="5581900000003">WhatsApp</button>
    </div>
  </div>
  <script>
    const inputSearch = document.getElementById('search');
    const cards = document.querySelectorAll('.card');
    inputSearch.addEventListener('input', filtrar);
    const botoesCategoria = document.querySelectorAll('.cat-btn');
    botoesCategoria.forEach(btn => {
      btn.addEventListener('click', () => {
        botoesCategoria.forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        filtrar();
      });
    });
    function filtrar() {
      const termo = inputSearch.value.toLowerCase();
      const categoriaAtiva = document.querySelector('.cat-btn.ativo').dataset.cat;
      cards.forEach(card => {
        const nome = card.dataset.nome;
        const categoria = card.dataset.categoria;
        const bateNome = nome.includes(termo);
        const bateCategoria = categoriaAtiva === 'todas' || categoria === categoriaAtiva;
        if (bateNome && bateCategoria) {
          card.classList.remove('oculto');
        } else {
          card.classList.add('oculto');
        }
      });
    }
    document.querySelectorAll('.whatsapp').forEach(btn => {
      btn.addEventListener('click', () => {
        const numero = btn.dataset.numero;
        const nomeEmpresa = btn.parentElement.querySelector('h3').textContent;
        const msg = `Olá! Vim pelo site Escada Conecta e gostaria de falar com a ${nomeEmpresa}.`;
        window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
      });
    });
  </script>
</body>
                                                         </html>
